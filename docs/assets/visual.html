<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页设计 · 本地</title>
<style>
  :root { --paper:#fbf9f4; --ink:#2b2723; --muted:#8a8276; --line:#e7e0d2; --accent:#7d5b43; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; background:#efe9dc; color:var(--ink);
         font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  form { width:340px; flex:none; background:var(--paper); border-right:1px solid var(--line);
         overflow-y:auto; padding:20px 20px 40px; }
  h1 { font-size:16px; letter-spacing:.16em; margin:0 0 22px; }
  h2 { font-size:12px; letter-spacing:.18em; color:var(--muted); font-weight:400; margin:22px 0 10px; }
  label { display:block; margin-bottom:11px; font-size:13px; color:#5f574c; }
  label input[type=text], label textarea { display:block; width:100%; margin-top:5px; padding:8px 10px;
         border:1px solid var(--line); border-radius:4px; background:#fff; font:inherit; font-size:14px; color:var(--ink); }
  label textarea { resize:vertical; line-height:1.6; }
  .colors { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; }
  .colors label { margin:0; font-size:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .colors input[type=color] { width:38px; height:26px; padding:0; border:1px solid var(--line); border-radius:4px; background:#fff; }
  .hint { margin-top:24px; font-size:12px; color:var(--muted); line-height:1.7; }
  .stage { flex:1; display:flex; flex-direction:column; min-width:0; padding:14px 18px 18px; }
  .stage-bar { display:flex; align-items:center; gap:8px; padding-bottom:10px; font-size:13px; }
  .stage-bar button { font:inherit; font-size:13px; padding:5px 12px; border:1px solid #d8cfbe; background:#fff;
         border-radius:4px; cursor:pointer; color:var(--ink); }
  .stage-bar button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .stage-bar a { margin-left:auto; color:var(--accent); font-size:13px; text-decoration:none; }
  .stage-bar a + a { margin-left:14px; }
  iframe { flex:1; width:100%; border:1px solid #d8cfbe; border-radius:6px; background:#fff;
           box-shadow:0 6px 24px rgba(60,40,25,.08); transition:width .25s; margin:0 auto; display:block; }
</style>
</head>
<body>
<form id="form">
  <h1>首页设计</h1>

  <h2>文字</h2>
  <label>站名<input type="text" data-path="title"></label>
  <label>副标题（小字）<input type="text" data-path="hero.eyebrow"></label>
  <label>简介<textarea rows="2" data-path="hero.desc"></textarea></label>
  <label>按钮文字<input type="text" data-path="hero.button"></label>

  <h2>顶部导航</h2>
  <label>第一个<input type="text" data-path="hero.nav.0"></label>
  <label>第二个<input type="text" data-path="hero.nav.1"></label>

  <h2>配色</h2>
  <div class="colors">
    <label>天空顶<input type="color" data-path="theme.skyTop"></label>
    <label>天空底<input type="color" data-path="theme.skyLow"></label>
    <label>远山<input type="color" data-path="theme.ridgeFar"></label>
    <label>中山<input type="color" data-path="theme.ridgeMid"></label>
    <label>近山<input type="color" data-path="theme.ridgeNear"></label>
    <label>前景<input type="color" data-path="theme.ridgeFront"></label>
    <label>近树<input type="color" data-path="theme.treeNear"></label>
    <label>前树<input type="color" data-path="theme.treeFront"></label>
    <label>强调色<input type="color" data-path="theme.accent"></label>
  </div>

  <p class="hint" id="hint">改哪儿右边就变，松手后自动保存并重建。</p>
</form>

<div class="stage">
  <div class="stage-bar">
    <button data-w="100%" class="on">桌面</button>
    <button data-w="390px">手机</button>
    <a href="/edit">改文章 →</a>
    <a href="/" target="_blank">新窗口打开</a>
  </div>
  <iframe id="preview" src="/"></iframe>
</div>

<script>
const get = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
function set(o, p, v) {
  const ks = p.split('.');
  let cur = o;
  for (let i = 0; i < ks.length - 1; i++) {
    const k = ks[i];
    if (cur[k] == null) cur[k] = /^\d+$/.test(ks[i + 1]) ? [] : {};
    cur = cur[k];
  }
  cur[ks[ks.length - 1]] = v;
}

let site = {};
let timer = 0;
const hint = document.getElementById('hint');
const preview = document.getElementById('preview');
const fields = () => document.querySelectorAll('[data-path]');

async function load() {
  site = await (await fetch('/api/site')).json();
  fields().forEach((el) => {
    const v = get(site, el.dataset.path);
    el.value = v == null ? '' : v;
  });
}

function collect() {
  fields().forEach((el) => set(site, el.dataset.path, el.value));
  return site;
}

async function save() {
  const r = await fetch('/api/site', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ site: collect() }),
  });
  const d = await r.json();
  if (!d.ok) { hint.textContent = '保存失败：' + (d.error || ''); return; }
  hint.textContent = '已保存，重建完成';
  preview.src = '/?t=' + Date.now();
}

document.addEventListener('input', (e) => {
  if (!e.target.dataset.path) return;
  clearTimeout(timer);
  hint.textContent = '改动中…';
  timer = setTimeout(save, 700);
});

document.querySelectorAll('[data-w]').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('[data-w]').forEach((x) => x.classList.toggle('on', x === b));
    preview.style.width = b.dataset.w;
  };
});

load();
</script>
</body>
</html>
